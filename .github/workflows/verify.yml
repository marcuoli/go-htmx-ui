name: verify
on: [push, pull_request]
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-go@v5
        with:
          go-version: '1.27.3'
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: go mod download
      - run: go run github.com/marcuoli/go-versioning/cmd/go-versioning inspect --repo . --json
      - run: go tool templ generate
      - run: npm --prefix web ci && npm --prefix web run build && npm --prefix web test
      - run: git diff --exit-code
      - run: go test ./... && go vet ./... && go mod verify
      - run: go build -o "$RUNNER_TEMP/go-htmx-ui-showcase" ./examples/showcase
